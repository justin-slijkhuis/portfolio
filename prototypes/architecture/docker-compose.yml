name: portfolio-architecture
services:
  portfolio:
    image: node:22-alpine3.20
    working_dir: /app/portfolio
    ports:
      - "5173:5173"
    volumes:
      - ./Portfolio:/app/portfolio
    entrypoint:
      - sh
      - -c
      - "npm install && npm run start"
    networks:
      - portfolio_network

  cms:
    image: node:22-alpine3.20
    working_dir: /app/cms
    ports:
      - "5174:5174"
    volumes:
      - ./CMS:/app/cms
    entrypoint:
      - sh
      - -c
      - "npm install && npm run start"
    depends_on:
      - portfolio
    networks:
      - portfolio_network

networks:
  portfolio_network:
    driver: bridge